<!DOCTYPE html>
<html>
    <head>
        <title>Practical of chapter 2</title>
    </head>
    <body>
        <h1>Welcome to practice excercise</h1>
        <p><strong>Q.1. </strong> Write a code to calculate hypotenuse of a triangle suggested to use prompt in js.</p>
        <script>
            alert("We are calculating hypotenuse of triangle");

            let a = Number(prompt("Enter length: "));  //prompt input is converted into string so converted into 'Number'.
            let b = Number(prompt("Enter breadth: "));

            let hypotenuse =  (a**2) + (b**2);

            alert(`The answer is: ${Math.sqrt(hypotenuse)}`);
        </script>
    </body>
</html>
