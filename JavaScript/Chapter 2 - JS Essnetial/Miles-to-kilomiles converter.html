    <body>
        <h1>We're learning chapter 2 | And solving excerciss given in chapter 2</h1>
        <p>Create a variable that contain a value in miles, convert it to kilometres, and log the value in kilometres in the following format:</p>
        <script>
            let a = Number(prompt("Enter Miles"));
            
            let kiloMeteres = a * 1.60934;

            alert(`The distance of ${a} miles is equal to ${kiloMeteres} Kilometers.`);
        </script>
