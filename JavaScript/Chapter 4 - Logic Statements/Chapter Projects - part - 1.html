<body>
    <h1>Chapter Projects | Page: 126</h1>
    <p>Evaluating a number game</p>

    <script>
        let userInput = Number(prompt("Enter a number: "));
        let rand = Math.floor(Math.random() * 5) + 1;
        let message = userInput == rand ? "Yay 🎉, you guessed it" : "Better luck next time";
        console.log("User guessed digit: " + userInput + "\n System Guessed digit: " + rand + "\n " + message);
    </script>
</body>
